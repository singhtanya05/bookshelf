name: Convert MOBI/AZW3 to EPUB

# No browser renders MOBI or AZW3, so uploads in those formats are converted
# here with Calibre and written back as EPUB. Trigger manually with the
# catalogue id and the current storage key.
#
# NOTE: DRM-protected Kindle files cannot be converted and will fail here.
# Only DRM-free files work.
on:
  workflow_dispatch:
    inputs:
      book_id:
        description: 'Catalogue id (uuid) of the book to convert'
        required: true

jobs:
  convert:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Install Calibre
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends calibre

      - name: Look up the storage key
        id: lookup
        run: |
          key=$(curl -fsS \
            -H "apikey: $SERVICE_ROLE" -H "Authorization: Bearer $SERVICE_ROLE" \
            "$SUPABASE_URL/rest/v1/books?id=eq.${{ inputs.book_id }}&select=storage_key" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["storage_key"])')
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "source key: $key"

      - name: Download source
        run: |
          curl -fsSL \
            -H "apikey: $SERVICE_ROLE" -H "Authorization: Bearer $SERVICE_ROLE" \
            "$SUPABASE_URL/storage/v1/object/books/${{ steps.lookup.outputs.key }}" \
            -o source.bin
          ls -lh source.bin

      - name: Convert to EPUB
        run: |
          # Calibre sniffs the real format regardless of the extension.
          ebook-convert source.bin output.epub
          ls -lh output.epub

      - name: Upload converted EPUB
        run: |
          newkey="library/${{ inputs.book_id }}.epub"
          curl -fsS -X POST \
            -H "apikey: $SERVICE_ROLE" -H "Authorization: Bearer $SERVICE_ROLE" \
            -H "Content-Type: application/epub+zip" \
            -H "x-upsert: true" \
            --data-binary @output.epub \
            "$SUPABASE_URL/storage/v1/object/books/$newkey"
          echo "newkey=$newkey" >> "$GITHUB_ENV"

      - name: Point the catalogue at the EPUB
        run: |
          curl -fsS -X PATCH \
            -H "apikey: $SERVICE_ROLE" -H "Authorization: Bearer $SERVICE_ROLE" \
            -H "Content-Type: application/json" \
            -d "{\"format\":\"epub\",\"storage_key\":\"$newkey\"}" \
            "$SUPABASE_URL/rest/v1/books?id=eq.${{ inputs.book_id }}"

      - name: Remove the original
        run: |
          curl -fsS -X DELETE \
            -H "apikey: $SERVICE_ROLE" -H "Authorization: Bearer $SERVICE_ROLE" \
            "$SUPABASE_URL/storage/v1/object/books/${{ steps.lookup.outputs.key }}" || true
